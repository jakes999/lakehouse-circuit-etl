resources:
  jobs:
    lakehouse_circuit_etl:
      name: lakehouse-circuit-etl-${bundle.target}
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 6 ? * MON-FRI"
        timezone_id: "Europe/London"
        pause_status: ${var.schedule_status}
      tasks:
        - task_key: bronze_ingestion
          max_retries: 2
          min_retry_interval_millis: 60000
          timeout_seconds: 1800
          notebook_task:
            notebook_path: ../src/01_bronze_ingestion.py
            base_parameters:
              catalog: ${var.catalog}
              reset_checkpoint: "false"
        - task_key: silver_quality
          max_retries: 2
          min_retry_interval_millis: 60000
          timeout_seconds: 1800
          depends_on:
            - task_key: bronze_ingestion
          notebook_task:
            notebook_path: ../src/02_silver_quality.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: gold_aggregates
          max_retries: 2
          min_retry_interval_millis: 60000
          timeout_seconds: 1800
          depends_on:
            - task_key: silver_quality
          notebook_task:
            notebook_path: ../src/03_gold_aggregates.py
            base_parameters:
              catalog: ${var.catalog}
      queue:
        enabled: true

